<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>UMM 宣传片录制</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #071827; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #status { position: fixed; inset: 0; display: grid; place-items: center; color: #effaff; font: 20px monospace; letter-spacing: .08em; }
  </style>
</head>
<body>
  <canvas width="1920" height="1080"></canvas>
  <div id="status">正在准备无旁白录制…</div>
  <script>
    const canvas = document.querySelector("canvas");
    const ctx = canvas.getContext("2d");
    const status = document.querySelector("#status");
    const fadeMs = 420;
    const frameMs = 1000 / 30;
    const waitFrame = () => new Promise((resolve) => requestAnimationFrame(resolve));

    async function loadManifest() {
      const manifest = await fetch("/recording-manifest.json").then((response) => response.json());
      const images = await Promise.all(manifest.frames.map((frame) => new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = reject;
        image.src = frame.src;
      })));
      return { manifest, images };
    }

    function draw(image, alpha = 1) {
      ctx.globalAlpha = alpha;
      ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
      ctx.globalAlpha = 1;
    }

    async function render() {
      const { manifest, images } = await loadManifest();
      const stream = canvas.captureStream(30);
      const mimeType = MediaRecorder.isTypeSupported("video/webm;codecs=vp9")
        ? "video/webm;codecs=vp9"
        : "video/webm";
      const recorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 8_000_000 });
      const chunks = [];
      recorder.ondataavailable = (event) => { if (event.data.size > 0) chunks.push(event.data); };
      const stopped = new Promise((resolve) => { recorder.onstop = resolve; });
      recorder.start(1000);
      status.textContent = "正在录制无旁白宣传片…";

      for (let index = 0; index < images.length; index += 1) {
        const duration = manifest.frames[index].durationMs;
        const end = performance.now() + duration;
        while (performance.now() < end) {
          draw(images[index]);
          await waitFrame();
        }
        if (index < images.length - 1) {
          const fadeEnd = performance.now() + fadeMs;
          while (performance.now() < fadeEnd) {
            const progress = 1 - (fadeEnd - performance.now()) / fadeMs;
            draw(images[index]);
            draw(images[index + 1], Math.max(0, Math.min(1, progress)));
            await waitFrame();
          }
        }
      }

      recorder.stop();
      await stopped;
      const blob = new Blob(chunks, { type: "video/webm" });
      const response = await fetch("http://127.0.0.1:5175/upload", { method: "POST", body: blob });
      if (!response.ok) throw new Error("无法保存录制文件");
      status.textContent = "录制完成，可以关闭此标签页。";
    }

    render().catch((error) => { status.textContent = `录制失败：${error.message}`; });
  </script>
</body>
</html>
